<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Portal</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #1d1f21, #3c3f41);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #card {
        background: #2a2c2e;
        width: 90%;
        max-width: 420px;
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        text-align: center;
    }
    h2 {
        margin-top: 0;
        font-weight: 700;
    }
    textarea {
        width: 100%;
        height: 140px;
        margin-top: 12px;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-size: 15px;
        resize: none;
        outline: none;
    }
    button {
        margin-top: 18px;
        padding: 12px 25px;
        font-size: 16px;
        background: #00aaff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: #0088cc;
    }
    #thanks {
        display: none;
        margin-top: 20px;
        font-size: 20px;
        font-weight: 600;
        color: #00ffcc;
    }
</style>

</head>
<body>

<div id="card">
    <h2>Your Feedback Matters</h2>
    <p>Please share your thoughts about our idea.</p>

    <textarea id="fb" placeholder="Type your feedback here..."></textarea>
    <button onclick="submitFB()">Submit Feedback</button>
    <div id="thanks">Thank you for your feedback! ✔</div>
</div>

<script>
function submitFB() {
    document.getElementById('fb').style.display = 'none';
    document.querySelector('button').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
}
</script>

</body>
</html>
